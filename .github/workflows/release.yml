name: Release

# Push a tag v<versionName> (e.g. v1.1 for versionName "1.1"). The job builds the release APK signed with the release
# key and publishes it as psrs-tv-overlay-<versionCode>.apk on a GitHub release; the PC app downloads that asset from
# the latest release. Needs these repository secrets:
#   PSRS_TV_KEYSTORE_BASE64    base64 of psrs-tv-release.jks
#   PSRS_TV_KEYSTORE_PASSWORD  store password
#   PSRS_TV_KEY_ALIAS          key alias (psrs-tv)
#   PSRS_TV_KEY_PASSWORD       key password
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the release signing certificate (public). A build signed with anything else is not published.
      EXPECTED_CERT_SHA256: b55d9e19f96224c27337f7c47175da466b3a865e727125200a33a54357090204
      BUILD_TOOLS: 36.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Use the Android SDK preinstalled on ubuntu-latest (ANDROID_HOME) and accept licenses ourselves;
      # android-actions/setup-android@v3 failed on `sdkmanager --licenses`.
      - name: Install SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37" "build-tools;${BUILD_TOOLS}"
      - name: Decode keystore
        env:
          PSRS_TV_KEYSTORE_BASE64: ${{ secrets.PSRS_TV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PSRS_TV_KEYSTORE_BASE64" ]; then
            echo "::error::Secret PSRS_TV_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$PSRS_TV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/psrs-tv-release.jks"
          echo "PSRS_TV_KEYSTORE=$RUNNER_TEMP/psrs-tv-release.jks" >> "$GITHUB_ENV"
      - name: Test and build release
        env:
          PSRS_TV_KEYSTORE_PASSWORD: ${{ secrets.PSRS_TV_KEYSTORE_PASSWORD }}
          PSRS_TV_KEY_ALIAS: ${{ secrets.PSRS_TV_KEY_ALIAS }}
          PSRS_TV_KEY_PASSWORD: ${{ secrets.PSRS_TV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Check signature and version
        id: check
        run: |
          set -euo pipefail
          dir=app/build/outputs/apk/release
          if [ -f "$dir/app-release-unsigned.apk" ]; then
            echo "::error::Release build was not signed (check the PSRS_TV_* secrets)"; exit 1
          fi
          apk="$dir/app-release.apk"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' | head -1)
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected certificate ($cert)"; exit 1
          fi
          badging=$("$tools/aapt2" dump badging "$apk" | head -1)
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          name=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name (expected tag v$name)"; exit 1
          fi
          cp "$apk" "psrs-tv-overlay-$code.apk"
          echo "asset=psrs-tv-overlay-$code.apk" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.check.outputs.asset }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" --title "$GITHUB_REF_NAME" --latest \
            --notes "PS Remote Sub TV overlay ${GITHUB_REF_NAME#v} (versionCode $CODE). Signed with the release key (certificate SHA-256 \`$EXPECTED_CERT_SHA256\`)."
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/psrs-tv-release.jks"
